body:
  text: 延平答問儒家類提要臣等謹案延平答問一卷附録一卷宋朱子撰程子之學一傳為楊時再𫝊為羅從彥又再𫝊為李侗侗字願中延平其所居也侗於朱子為父執紹興二十三年朱子二十四嵗將赴同安主簿任往見侗於延平始從受學紹興三十年同安任滿再見侗僅留月餘又閲四載而侗殁計前後相從不過數月故書札往來問答為多後朱子輯而録之又載其與劉平甫二條以成是書朱子門人又取朱子平昔論延平語及祭文行狀別為一卷題曰附録明非朱子原本所有也後侗裔孫葆初別掇拾侗之詩文增入一卷改題曰延平文集且總題為朱子所編殊失其舊今仍録原本而葆初竄亂之本別存目於集部焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:56f8fa91e7acd88d5747971f042da575df2316d0b9c6fc02448fb26a068ddee7
