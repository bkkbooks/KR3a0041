body:
  text: 延平答問宋朱子撰丁丑六月二十六日書云承諭涵養用力處足見近來好學之篤也甚慰甚慰但常存此心勿為他事所勝即欲慮非僻之念自不作矣孟子有夜氣之説更熟味之當見涵養用力處也於涵養處著力正是學者之要若不如此存養終不為己物也更望勉之戊寅七月十七日書云某村居一切只如舊有不可不應接處又難廢墮但靳靳度日爾朝夕無事齒髮皆已邁筋力漸不如昔所得於師友者往來於心求所以脫然處竟未得力頗以是懼爾春秋且將諸家熟看以胡文定解為凖玩味久必自有會心處卒看不得也伊川先生云春秋大義數十炳如日星所易見也唯徴辭奧旨時措從宜者所難知爾更須詳考其事又玩味所書抑揚豫奪之處看如何積道理多庶漸見之大率難得學者無相啓發處終憒憒不灑落爾問子曰父在觀其志父沒觀其行三年無改於父之道可謂孝矣東坡謂可改者不待三年熹以為使父之道有不幸不可不即改者亦當隱忍遷就於義理之中使事體漸正而人不見其改之之迹則雖不待三年而謂之無改可也此可見孝子之心與幾諫事亦相類先生曰三年無改前輩論之詳矣類皆執文泥迹有所遷就失之須是認聖人所説於言外求意乃通所謂道者是猶可以通行者也三年之中日月易過若稍稍有不愜意處即率意改之則孝子之心何在如説春秋者不忍遽變左氏有官命未改之類有孝子之心者自有所不忍耳非斯須不忘極體孝道者能如是耶東坡之語有所激而然是亦有意也事只有箇可與不可而已若大段有害處自應即改何疑恐不必言隱忍遷就使人不見其改之之迹此意雖未有害第恐處心如此即駸駸然所失處却多吾輩欲求寡過且謹守格法為不差也幾諫事意恐不相類更思之問孟武伯問孝子曰父母唯其疾之憂舊説孝子不妄為非唯疾病然後使父母憂熹恐夫子告孟孫之意不然蓋言父母之心慈愛其子無所不至疾病人所不免猶恐其有之以為憂則餘可知也為人子者知此而以父母之心為心則所以奉承遺體而求免於虧辱者豈一端而已哉此曾子所以戰戰兢兢啓手足而後知免焉者也不逺遊遊必有方不登高不臨深皆是此意先生曰父母唯其疾之憂當如上所説為得之舊説不直截聖人之告人使知所以自求者惟深切庶可用力也問子遊問孝子曰今之孝者是謂能養至於犬馬皆能有養不敬何以别乎熹謂犬馬不能自食待人而食者也故蓄犬馬者必有以養之但不敬爾然則養其親而敬有所不至不幾於以犬馬視其親乎敬者尊敬而不敢忽忘之謂非特恭謹而已也人雖至愚孰忍以犬馬視其親者然不知幾微之間尊敬之心一有不至則是所以視其親者實無以異於犬馬而不自知也聖人之言警乎人子未有若是之切者然諸家之説多不出此熹謂當以春秋所書歸生許止之事觀之則所謂犬馬之養誠不為過不然設譬引喻不應如是之疏而子遊之賢亦不待如此告戒之也先生曰此一段恐當時之人習矣而不察只以能養為孝雖孔門學者亦恐未免如此故夫子警切以告之使之反諸心也苟推測至此孝敬之心一不存焉即陷於犬馬之養矣孟子又有養口體養志之説似亦説破學者之未察處皆所以警乎人子者也若謂以春秋所書之事觀之則所謂犬馬之養誠不為過恐不須如此説歸生許止各是發明一例也問子曰吾與回言終日不違如愚退而省其私亦足以發回也不愚熹竊謂亦足以發是顏子聞言悟理心契神受之時夫子察焉而於心有感發也子夏禮後之問夫子以為起豫亦是類也但子夏所發在言語之間而顏子所發乃其所自得處有以默相契合不待言而喻也然非聖人有所未知必待顏子而後發如言非助我者豈聖人待門弟子答問之助耶先生曰亦足以發前説似近之恐與起豫不類深玩之可見非助我者豈聖人待門弟子答問之助固是如此然亦須知顏子默曉聖人之言便知親切道體處非枝葉之助也他人則不能見如此精微矣妄意如此氣象未知如何問子張學干祿夫子告以多聞多見闕疑殆而謹言行其餘蓋不博無以致約故聞見以多為貴然不闕其所未信未安則言行之間意不誠矣故以闕之為善疑殆既闕而於言行有不謹焉則非所謂無敢慢者故以謹之為至有節於內若此尤悔何自而入乎然此皆庸言庸行之所必然非期以干祿也而祿固已在其中矣孟子曰經德不回非以干祿也與夫子之意一也伊川先生亦曰子張以仕為急故夫子告之以此使定其心而不為利祿動恐亦是此意未知是否先生曰古人干祿之意非後世之干祿也蓋胸中有所藴亦欲發泄而見諸事爾此為己之學也然求之有道苟未見所以求之之道一萌意焉則外馳矣故夫子以多聞見而闕疑殆告之又使之慎其餘則反求諸已也切矣故孟子有經德不回非以干祿之語苟能深體得此則馳外之心不作矣伊川所謂才有縫罅便走了之意戊寅冬至前二日書云承示問皆聖賢之至言某何足以知之而吾元晦好學之篤如此又安敢默默也輒以昔所聞者各箋釋於所問目之下聊以塞命爾他日若獲欵曲須面質論難又看合否如何大率須見灑然處然後為得雖説得行未敢以為然也問向以亦足以發之義求教因引起豫為證蒙批諭云亦足以發與起豫不類熹反覆思之於此二者但見有淺深之異而未見全不相似處乞賜詳喻先生曰顏子氣象與子夏不同先玩味二人氣象於胸中然後體會夫子之言亦足以發與起豫者商也之語氣象如何顏子深潛純粹於聖人體段已具故聞夫子之言即默識心融觸處洞然自有條理故終日言但見其不違如愚而已退省其私則於語默日用動容之間皆足以發明夫子之道坦然由之而無疑也子夏因問詩如不得繪事後素之言即禮後之意未必到似有因問此一事而夫子印可之意此所以不類也不知是如此否偶追憶前日所問處意不來又未知向日因如何疑而及此也更俟他日熟論問春秋威公二年滕子來朝按滕本稱侯伊川謂服屬於楚故貶稱子熹按楚是時未與中國通滕又逺楚終春秋之世未嘗事楚但為宋役爾不知伊川别有何據又陳蔡諸國後來屬楚者亦未嘗貶爵也胡文定以為為朝威而貶之以討亂賊之黨此義似勝然滕自此不復稱侯至定公之喪來會葬猶稱子夫豈以祖世有罪而并貶其子孫乎然則胡氏之説亦有可疑者不知當以何説為正胡氏又謂凡朝威者皆貶獨紀侯以咨謀齊難而來志不在於朝威故再朝皆無貶焉熹竊以為果如此則是義理之正可以危急而棄之也不知春秋之法果如此否二年紀侯來朝左氏作杞字後有入杞會鄧事傳皆有説可據伊川胡氏依公榖作紀字先生曰滕子來朝考之春秋夫子凡所書諸侯來朝皆不與其朝也胡文定謂春秋之時諸侯之朝皆無有合於先王之時世朝之禮者故書皆譏之也滕本稱侯威二年來朝稱子者以討亂賊之黨貶於諸家之説義為精先儒又以為時王所黜者胡氏以為果如此則春秋不作矣恐先儒之説非來喻以謂自此終春秋之世不復稱侯豈以祖世有罪而并貶其子孫乎若如此言大段害理春秋與人改過遷善又善善長惡惡短不應如此是可疑也某竊以謂從胡之説於理道為長觀夫子所書討亂之法甚嚴滕不以威之不義而朝之只在於合黨締交此非正也既已貶矣後世子孫碌碌無聞無以自見於時又壤地褊小本一子男之國宋之盟左傳有宋人請滕欲以為私屬則不自強而碌碌於時者久矣自一貶之後夫子再書各沿一義而發遽又以侯稱之無乃紛紛然淆亂春秋之旨不明而失其指乎蓋聖人之心必有其善然後進之若無所因是私意也豈聖人之心哉若如此看似於後世之疑不礙道理為通又不知如何春秋所以難看者蓋以常人之心推測聖人未到聖人灑然處豈能無失耶請俟他日反復面難庶幾或得其旨伊川之説考之諸處未見春秋之前服屬於楚事迹更俟尋考又來喻以謂紀侯來咨謀齊難志不在於朝威故再朝無貶則是義理之正可以危急而棄之若果如此尤害義理春秋有誅意之説紀侯志不在於朝威則非滕子之類也列國有急難以義而動又何貶耶紀侯來朝左氏作杞字後有入杞之事傳皆有説胡氏因公榖作紀字春秋似此類者多如齊子糾左傳只云納糾伊川乃以二傳為證又嘗有看春秋之法云以傳考經之事迹以經别傳之真偽參考義理之長求聖人所書之意庶或得之問禮之用和為貴一章之義先生曰孟子曰仁之實事親是也義之實從兄是也禮之實節文斯二者是也禮之道雖以和為貴然必須體其源流之所自來而節文之則不失矣若小大由之而無隆殺之辨知和而和於節文不明是皆不可行則禮之體用失矣世之君子有用禮之嚴至拘礙者和而失其節者皆非知禮者也故有子以是語門人使知其節爾問因不失其親亦可宗也橫渠先生曰君子寧孤立無與不失親於可賤之人熹據此則因也親也宗也皆依倚附託之名但言之漸重爾所因或失其所親謂可賤之人不可親也則亦不可宗人之可親者必可宗其不可親者必不可宗也故君子非孤立無與之患而不失其親為難其將欲有所因也必擇其可親者而因之使彼誠賢則我不失其所親而彼亦可宗矣其文與上二句相似皆言必慮其所宗行必稽其所敝之意不審尊意以為如何先生曰伊川先生曰信本不及義恭本不及禮然信近於義恭近於禮也信近於義以言可復也恭近於禮以逺恥辱也因恭信而不失親近於禮義故亦可宗也猶言禮義者不可得見得見恭信者可矣詳味此語則失親於可賤之人自無有矣蓋以禮義為主故也問詩三百一言以蔽之曰思無邪蘇東坡曰夫子之於詩取其會於吾心者斷章而言之頌魯侯者未必有意於是也子由曰思無邪則思馬而馬應思馬而馬應則思之所及無不應也故曰思無邪思馬斯徂此頌魯侯之意也兩説未知孰是先生曰詩人興刺雖亦曲折達心之精微然必止乎禮義夫子刪而取之者以此爾若不止於禮義即邪也故三百篇一言足以蔽之只是思無邪而已所以能興起感動人之善心蓋以此也頌魯侯者偶於形容盛德如此故曰思無邪於馬言之者又有秉心塞淵然後騋牝三千之意問吾十有五而志於學一章橫渠先生曰常人之學日益而莫自知也仲尼行著習察異於他人故自十五至於七十化而知裁其進德之盛者與伊川先生曰孔子生而知之自十五至七十進德直有許多節次者聖人未必然亦只是為學者立一下法盈科而後進不可差次須是成章乃達兩説未知孰是先生曰此一段二先生之説各發明一義意思深長橫渠云化而知裁伊川云盈科而後進不成章不達皆是有力處更當深體之可爾某竊以謂聖人之道中庸立言常以中人為説必十年乃一進者若使困而知學積十年之久日孳孳而不倦是亦可以變化氣質而必一進也若以鹵莽滅裂之學而不用心焉雖十年亦只是如此則是自暴自棄之人爾言十年之漸次所以警乎學者雖中才於夫子之道皆可積習勉力而至焉聖人非不可及也不知更有此意否問禘自既灌而往者吾不欲觀之矣伊川曰灌以降神祭之始也既灌而往者自始及終皆不足觀言魯祭之非禮也謝氏引禮記曰吾欲觀夏道是故之杞而不足證也我欲觀殷道是故之宋而不足證也我觀周道幽厲傷之吾舍魯何適矣魯之郊禘非禮也周公其衰矣以此為證而合此章於上文杞宋不足證之説曰考之杞宋則文獻不足考之當今則魯之郊禘又不足觀蓋傷之也吕博士引苟子大昏之未發祭之未納户喪之未小斂一也解此與趙氏春秋纂例之説不審何者為是先生曰記曰魯之郊禘非禮也周公其衰矣以其難言故春秋皆因郊禘事中之失而書譏魯自在其中今曰禘自既灌而往者吾不欲觀之矣則是顛倒失禮如昭穆失序之類於灌而求神以至於終皆不足觀蓋歎之也對或人之問又曰不知則夫子之深意可知矣既曰不知又曰知其説者之於天下也其如示諸斯乎指其掌則非不知也只是難言爾原幽明之故知鬼神之情狀則燭理深矣於天下也何有問或問禘之説一章伊川以此章屬之上文曰不知者蓋為魯諱知夫子不欲觀之説則天下萬物各正其名其治如指諸掌也或以為此魯君所當問而不問或人不當問而問之故夫子以為不知所以微諷之也餘如伊川説云龜山引禮記禘嘗之義大矣治國之本也不可不知也明其義者君也能其事者臣也不明其義君人不全不能其事為臣不全非或人可得而知也其為義大豈度數云乎哉蓋有至賾存焉知此則於天下乎何有此數説不審孰是先生曰詳味禘自既灌以下至指其掌看夫子所指意處如何却將前後數説皆包在其中似意思稍盡又未知然否問祭如在祭神如神在熹疑此二句乃弟子記孔子事又記孔子之言於下以發明之曰吾不與祭如不祭也先生曰某嘗聞羅先生曰祭如在及見之者祭神如神在不及見之者以至誠之意與鬼神交庶幾享之若誠心不至於禮有失焉則神不享矣雖祭也何為問居上不寬為禮不敬臨喪不哀吾何以觀之哉熹謂此非謂不足觀蓋不誠無物無物則無以觀之也先生曰居上寬為禮敬臨喪哀皆其本也有其本而末應若無其本粲然文采何足觀問子曰參乎吾道一以貫之曾子曰唯子出門人問曰何謂也曾子曰夫子之道忠恕而已矣熹謂曾子之學主於誠身其於聖人之日用觀省而服習之蓋已熟矣惟未能即此以見夫道之全體則不免疑其有二也然用力之久而亦將有以自得故夫子以一以貫之之語告之蓋當其可也曾子惟此少許未達故夫子直以此告之曾子於是默會其旨故門人有問而以忠恕告之蓋以夫子之道不離乎日用之間自其盡已而言則謂之忠自其及物而言則謂之恕莫非大道之全體雖變化萬殊於事為之末而所以貫之者未嘗不一也然則夫子所以告曾子曾子所以告其門人豈有異旨哉而或者以為忠恕未足以盡一貫之道曾子姑以違道不逺者告其門人使知入道之端恐未曾盡曾子之意也如子思之言忠恕違道不逺乃是示人以入道之端如孟子之言行仁義曽子之稱夫子乃所謂由仁義行者也先生曰伊川先生有言曰維天之命於穆不已忠也乾道變化各正性命恕也體會於一人之身不過只是盡已及物之心而已曾子於日用處夫子自有以見之恐其未必覺此亦是一貫之理故卒然問曰參乎吾道一以貫之曾子於是領會而有得焉輒應之曰唯忘其所以言也東坡所謂口耳俱喪者亦佳至於答門人之問只是發其心耳豈有二耶若以謂聖人一以貫之之道其精微非門人之問所可告姑以忠恕答之恐聖賢之心不如是之支也如孟子稱堯舜之道孝弟而已人皆足以知之但合內外之道使之體用一源顯微無間精粗不二衮同盡是此理則非聖人不能是也中庸曰忠恕違道不逺特起此以示人相近處然不能貫之則忠恕自是一忠恕爾十一月十三日書云吾人大率坐此窘窶百事驅遣不行唯於稍易處處之為庶幾爾某村居兀坐一無所為亦以窘迫遇事窒塞處多每以古人貧甚極難堪處自體即啜菽飲水亦自有餘矣夫復何言來喻以為人心之既放如木之既伐心雖既放然夜氣所息而平旦之氣生焉則其好惡猶與人相近木雖既伐然雨露所滋而萌蘖生焉則猶有木之性也恐不用如此説大凡人禮義之心何嘗無唯持守之即在爾若於旦晝間不至梏亡則夜氣存矣夜氣存則平旦之氣未與物接之時湛然虛明氣象自可見此孟子發此夜氣之説於學者極有力若欲涵養須於此持守可爾恐不須説心既放木既伐恐又似隔截爾如何如何又見喻云伊川所謂未有致知而不在敬者考大學之序則不然如夫子言非禮勿視聽言動伊川以為制之於外以養其中數處蓋皆各言其入道之序如此要之敬自在其中也不必牽合貫穿為一説又所謂但敬而不明於理則敬特出於勉強而無灑落自得之功意不誠矣灑落自得氣象其地位甚高恐前數説方是言學者下工處不如此則失之矣由此持守之久漸漸融釋使之不見有制之於外持敬之心理與心為一庶幾灑落爾某自聞師友之訓賴天之靈時常只在心目間雖資質不美世纍妨奪處多此心未嘗敢忘也於聖賢之言亦時有會心處亦間有識其所以然者但覺見反為理道所縳殊無進步處今已老矣日益恐懼吾元晦乃不鄙孤陋寡聞逺有質問所疑何愧如之己卯六月二十二日書云聞不輟留意於經書中縱未深自得亦可以驅遣俗纍氣象自安間也己卯長至後三日書云今學者之病所患在於未有灑然氷解凍釋處縱有力持守不過只是苟免顯然尤悔而已似此恐皆不足道也庚辰五月八日書云某晚景别無他唯求道之心甚切雖間能窺測一二竟未有灑落處以此兀坐殊憒憒不快昔時朋友絶無人矣無可告語安得不至是耶可嘆可懼示諭夜氣説甚詳亦只是如此切不可更生枝節尋求即恐有差大率吾輩立志已定若看文字心慮一澄然之時略綽一見與心會處便是正理若更生疑即恐滯礙伊川語録中有記明道嘗在一倉中坐見廊柱多因默數之疑以為未定屢數愈差遂至令一人敲柱數之乃與初默數之數合正謂此也夜氣之説所以於學者有力者須是兼旦晝存養之功不至梏亡即夜氣清若旦晝間不能存養即夜氣何有疑此便是日月至焉氣象也曩時某從羅先生學問終日相對靜坐只説文字未嘗及一雜語先生極好靜坐某時未有知退入室中亦只靜坐而已先生令靜中看喜怒哀樂未發之謂中未發時作何氣象此意不唯於進學有力兼亦是養心之要元晦偶有心恙不可思索更於此一句內求之靜坐看如何往往不能無補也此中相去稍逺思欲一見未之得恐元晦以親旁無人傔侍亦難一來奈何切望隨宜攝養勿貽親念為至禱也承惠示濂溪遺文與潁濱語孟極荷愛厚不敢忘不敢忘邇書向亦曾見一二但不曾得見全本今乃得一觀殊慰卑抱也二蘇語孟説儘有可商論處俟他日見面論之嘗愛黃魯直作濂溪詩序云舂陵周茂叔人品甚高胸中灑落如光風霽月此句形容有道者氣象絶佳胸中灑落即作為盡灑落矣學者至此雖甚逺亦不可不常存此體段在胸中庶幾遇事廓然於道理方少進願更存養如此羅先生山居詩某記不全今只據追思得者録去顏樂齋詩云山染嵐光帶日黃蕭然茅屋枕池塘自知寡與真堪笑此一句似非賴有顏瓢一味長池畔亭曰濯纓詩云擬把冠纓挂牆壁等間窺影自相酬邀月臺詩云矮作牆垣小作臺時邀明月寫襟懷夜深獨有長庚伴不許庸人取次來又有獨寐榻白雲亭詩皆忘記白雲亭坐處望見先生母氏墳故名某向日見先生將出此詩邀月臺詩後兩句不甚愜人意嘗忘意云先生可改下兩句不甚渾然先生别云也知鄰鬬非吾事且把行藏付酒杯蓋作此數絶時正靖康間也聞召命不至復有指揮今來亦執前説辭之甚佳蓋守之已定自應如此縱煎迫擾擾何與我事若於義可行便脫然一往亦可也某嘗以謂遇事若能無毫髮固滯便是灑落即此心廓然大公無彼己之偏倚庶幾於理道一貫若見事不徹中心未免微有偏倚即涉固滯皆不可也未審元晦以為如何為此説者非理道明心與氣合未易可以言此不然只是説也庚辰七月書云某自少時從羅先生學問彼時全不涉世故未有所聞入先生之言便能用心靜處尋求至今淟汩憂患磨滅甚矣四五十年間每遇情意不可堪處即猛省提掇以故初心未嘗忘廢非不用力而迄於今更無進步處常切靜坐思之疑於持守及日用儘有未合處或更有關鍵未能融釋也向來嘗與夏丈言語間稍無間因得一次舉此意質之渠乃以釋氏之語來相淘終有纎姦打訛處全不是吾儒氣味旨意大段各别當俟他日相見劇論可知大率今人與古人學殊不同如孔門弟子羣居終日相切摩又有夫子為之依歸日用相觀感而化者甚多恐於融釋而脫落處非言説可及也不然子貢何以謂夫子之言性與天道不可得而聞耶元晦更潛心於此勿以老邁為戒而怠於此道乃望承欲秋涼來又不知偏侍下别無人可以釋然一來否只為往來月十日事疑亦可矣但亦須處得老人情意帖帖無礙乃佳爾所云見語録中有仁者渾然與物同體一句即認得西銘意旨所見路脈甚正宜以是推廣求之然要見一視同仁氣象却不難須是理會分殊雖毫髮不可失方是儒者氣象又云因看必有事焉而勿正心勿忘勿助長數句偶見全在日用間非著意非不著意處才有毫髮私意便沒交涉此意亦好但未知用處却如何須喫緊理會這裡始得某曩時傳得吕與叔中庸解甚詳當時陳幾叟與羅先生門皆以此文字説得浸灌浹洽比之龜山解却似枯燥晚學未敢論此今此本為相知借去亡之已久但尚記得一段云謂之有物則不得於言謂之無物則必有事焉不得於言者視之不見聽之不聞無聲形接乎耳目而可以道也必有事焉者莫見乎隱莫顯乎微體物而不可遺者也學者見乎此則庶乎能擇乎中庸而執之隱微之間不可求之於耳目不可道之於言語然有所謂昭昭而不可欺感之而能應者正惟虛心以求之則庶乎見之又據孟子説必有事焉至於助長不耘之意皆似是言道體處來諭乃體認出來學者正要如此但未知用時如何吻合渾然體用無間乃是不然非著意非不著意溟溟涬涬疑未然也某嘗謂進步不得者倣佛多是如此類窒礙更望思索他日熟論須見到心廣體胖遇事一一灑落處方是道理不爾只是説也又云便是日月至焉氣象一段某之意只謂能存養者積久亦可至此若此之不違氣象又迥然别也今之學者雖能存養知有此理然旦晝之間一有懈焉遇事應接舉處不覺打發機械即離間而差矣唯存養熟理道明習氣漸爾消鑠道理油然而生然後可進亦不易也來諭以謂能存養者無時不在不止日月至焉若如此時却似輕看了也如何承諭心與氣合及所注小字意若逐一理會心與氣即不可某鄙意止是形容到此解會融釋不如此不見所謂氣所謂心渾然一體流浹也到此田地若更分别那箇是心那箇是氣即勞攘爾不知可以如此否不然即成語病無疑若更非是無惜徑論吾儕正要如此録示明道二絶句便是吟風弄月有吾與點也之氣味某尚疑此詩若是初見周茂叔歸時之句即可此後所發之語恐又不然也二蘇語孟説儘有好處蓋渠聰明過人天地間理道不過只是如此有時見到皆渠聰明之發也但見到處却有病學者若要窮理亦不可不論某所謂儘有商議者謂此爾如來諭云説養氣處皆顛倒了渠本無淵源自應如此也然得惠此本所警多矣某兀坐於此朝夕無一事若可以一來甚佳致千萬意如此然又不敢必覬恐侍旁乏人老人或不樂即未可更須於此審處之某尋常處事每值情意迫切處即以輕重本末處之似少悔吝願於出處間更體此意辛巳二月二十四日書云示下所疑極荷不外已有鄙見之説繼其後矣但素來拙訥發脫道理不甚明亮得以意詳之可也問性相近也習相逺也二程先生謂此言氣質之性非性之本尹和靖云性一也何以言相近蓋由習相逺而為言熹按和靖之意云性一也則正是言性之本萬物之一源處所以云近但對逺而言非實有異品而相近也竊謂此説意稍渾全不知是否先生曰尹和靖之説雖渾全然却似沒話可説學者無著力處恐須如二先生謂此言氣質之性使人思索體認氣質之説道理如何為有力爾蓋氣質之性不究本源又由習而相逺政要玩此曲折也問公山弗擾佛肸二章程先生謂欲往者聖人以天下無不可改過之人故欲往然終不往者知其必不能改也又云欲往者示人以迹子路不喻熹疑召而欲往乃聖人虛明應物之心答其善意自然而發終不往者以其為惡已甚義不可復往也此乃聖人體用不偏道並行而不相悖處不知是否又兩條告子路不同者即其所疑而喻之爾子路於公山氏疑聖人之不必往故夫子言可往之理此語意中微似年木隨身之意不知然否於佛肸恐其凂夫子也故夫子告以不能凂己之意不知是否又謂示人以迹者熹未喻其旨先生曰元晦前説深測聖人之心一箇體段甚好但更有少礙若使聖人之心不度義如此易動即非就此更下語又兩條告子路不同即其疑而踰之以下亦佳竿木隨身之説氣象不好聖人定不如是元晦更熟玩孔子所答之語求一指歸處方是聖人廓然明達無所不可非道大德宏者不能爾也子路未至此於所疑處即有礙龜山謂之包羞誠有味也示人以迹恐只是心迹據此事迹皆可為然又未必爾者蓋有憂樂行違確然之不同無定體也問豫欲無言明道龜山皆云此語為門人而發熹恐此句從聖人前後際斷使言語不著處不知不覺地流出來非為門人發也子貢聞之而未喻故有疑問到後來自云夫子之文章可得而聞也夫子之言性與天道不可得而聞也方是契此旨趣顏曾則不待疑問若子貢以下又不知所疑也先生曰此一段説甚佳但云前後際斷使言語不著處不知不覺地流出來恐不消如此説只玩夫子云天何言哉四時行焉百物生焉天何言哉數語便見氣味深長則豫欲無言可知旨歸矣問殷有三仁焉和靖先生曰無所擇於利害而為所當為惟仁者能之熹未見微子當去箕子當囚比干當死端的不可易處不知使三人者易地而處又何如東坡云箕子常欲立微子帝乙不從而立紂故箕子告微子曰我舊云刻子王子不出我乃顛隮是以二子或去或囚蓋居可疑之地雖諫不見聽故不復諫比干則無所嫌故諫而死胡明仲非之曰如此是避嫌疑度利害也以此論仁不亦逺乎熹按此破東坡之説甚善但明仲自解乃云微子殷王元子以存宗祀為重而非背國也比干三孤以義弼君以存人臣之義而非要名也箕子天畀九疇以存皇極之法為天而非貪生也熹恐此説亦未盡善如箕子一節尤無意思不知三人者端的當為處當何如以求之先生曰三人各以力量竭力而為之非有所擇此求仁得仁者也微子義當去箕子囚奴偶不死爾比干即以死諫庶幾感悟存祀九疇皆後來事初無此念也後來適然爾豈可相合看致仁人之心不瑩徹耶仁只是理初無彼此之辨當理而無私心即仁矣胡明仲破東坡之説可矣然所説三人後來事相牽何異介甫之説三仁恐如此政是病處昏了仁字不可不察問太極動而生陽先生嘗曰此只是理做已發看不得熹疑既言動而生陽即與復卦一陽生而見天地之心何異竊恐動而生陽即天地之喜怒哀樂發處於此即見天地之心二氣交感化生萬物即人物之喜怒哀樂發處於此即見人物之心如此做兩節看不知得否先生曰太極動而生陽至理之源只是動靜闔闢至於終萬物始萬物亦只是此理一貫也到得二氣交感化生萬物時又就人物上推亦只是此理中庸以喜怒哀樂未發已發言之又就人身上推尋至於見得大本達道處又衮同只是此理此理就人身上推尋若不於未發已發處看即緣何知之蓋就天地之本源與人物上推來不得不異此所以於動而生陽難以為喜怒哀樂已發言之在天地只是理也今欲作兩節看切恐差了復卦見天地之心先儒以為靜見天地之心伊川先生以為動乃見此恐便是動而生陽之理然於復卦發出此一段示人又於初爻以顏子不逺復為之此只要示人無間斷之意人與天理一也就此理上皆收攝來與天地合其德與日月合其明與四時合其序與鬼神合其吉凶皆其度內爾妄測度如此未知元晦以為如何有疑更容他日得見劇論語言既拙又無文采似發脫不出也元晦可意會消詳之看理道通否辛巳上元日書云昔嘗得之師友緒餘以謂學問有未愜適處只求諸心若反身而誠清通和樂之象見即是自得處更望勉力以此而已辛巳五月二十六日書云某村居一切如舊無可言者窘束為人事所牽間有情意不快處一切消釋不復能恤蓋日昃之離理應如此爾承諭近日學履甚適向所耽戀不灑落處今已漸融釋此便是道理進之效甚善甚善思索有窒礙及於日用動靜之間有咈戾處便於此致思求其所以然者久之自循理爾五十知天命一句三先生之説皆不敢輕看某尋常看此數句竊以謂人之生也自少壯至於老耄血氣盛衰消長自不同學者若循其理不為其所使則聖人之言自可以馴致但聖賢所至處淺深之不同爾若五十矣尚昧於所為即大不可也橫渠之説似有此意試一思索看如何辛己中元後一日書云諭及所疑數處詳味之所見皆正當可喜但於灑落處恐未免滯礙今此便速不暇及之謹俟涼爽可以來訪就曲折處相難庶彼此或有少補焉爾辛己十月十日書云看文字必覺有味靜而定否承録示韋齋記追往念舊令人淒然某中間所舉中庸始終之説元晦以謂肫肫其仁淵淵其淵浩浩其天即全體是未發底道理惟聖人盡性能然若如此看即於全體何處不是此氣象第恐無甚氣味爾某竊以謂肫肫其仁以下三句乃是體認到此達天德之效處就喜怒哀樂未發處存養至見此氣象儘有地位也某嘗見吕藝閣與伊川論中説吕以謂循性而行無往而非禮義伊川以謂氣味殊少吕復書云云政謂此爾大率論文字切在深潛縝密然後蹊徑不差釋氏所謂一超直入如來地恐其失處正坐此不可不辨某衰晚碌碌只如舊所恨者中年以來即為師友捐棄獨學無助又涉世故沮困殆甚尚存初心有端緒之可求時時見於心目爾壬午四月二十二日書云吾儕在今日只可於僻寂處草木衣食苟度此嵗月為可他一切置之度外惟求進此學問為庶幾爾若欲進此學須是盡放棄平日習氣更鞭飭所不及處使之脫然有自得處始是道理少進承諭應接少暇即體究方知以前皆是低看了道理此乃知覺之效更在勉之有所疑便中無惜詳及庶幾彼此得以自警也壬午五月十四日書云承諭處事擾擾便似內外離絶不相該貫此病可於靜坐時收攝將來看是如何便如此就偏著處理會久之知覺漸漸可就道理矣更望勉之也壬午六月十一日書云承諭仁一字條陳所推測處足見日來進學之力甚慰某嘗以謂仁字極難講説只看天理統體便是更心字亦難指説唯認取發用處是心二字須要體認得極分明方可下工夫仁字難説論語一部只是説與門弟子求仁之方知所以用心庶幾私欲沈天理見則知仁矣如顏子仲弓之問聖人所以答之之語皆其要切用力處也孟子曰仁人心也心體通有無貫幽明無不包括與人指示於發用處求之也又曰仁者人也人之一體便是天理無所不備具若合而言之人與仁之名亡則渾是道理也來諭以謂仁是心之正理能發能用底一箇端緒如胎育包涵其中生氣無不純備而流動發生自然之機又無傾刻停息憤盈發泄觸處貫通體用相循初無間斷此説推擴得甚好但又云人之所以為人而異乎禽獸者以是而已若犬之性牛之性則不得而與焉若如此説恐有礙蓋天地中所生物本源則一雖禽獸草木生理亦無頃刻停息間斷者但人得其秀而最靈五常中和之氣所聚禽獸得其偏而已此其所以異也若謂流動發生自然之機與夫無傾刻停息間斷即禽獸之體亦自如此若以為此理唯人獨得之即恐推測體認處未精於他處便有差也又云須體認到此純一不雜處方見渾然與物同體氣象一段語却無病又云從此推出分殊合宜處便是義以下數句莫不由此而仁一以貫之蓋五常百行無往而非仁也此説大概是然細推之却似不曾體認得伊川所謂理一分殊龜山云知其理一所以為仁知其分殊所以為義之意蓋全在知字上用著力也謝上蔡語録云不仁便是死漢不識痛癢了仁字只是有知覺了了之體段若於此不下工夫令透徹即緣何見得本源毫髮之分殊哉若於此不了了即體用不能兼舉矣此正是本源體用兼舉處人道之立正在於此仁之一字正如四德之元而仁義二字正如立天道之隂陽立地道之柔剛皆包攝在此二字爾大抵學者多為私欲所分故用力不精不見其效若欲於此進步須把斷諸路頭靜坐默識使之泥滓漸漸消去方可不然亦只是説也更熟思之葉公問孔子於子路子路不對一章昔日得之於吾黨中人謂葉公亦當時號賢者夫子名德經天緯地人孰不識之葉公尚自見問於其徒所見如此宜子路之不對也若如此看仲尼之徒渾是客氣非所以觀子路也蓋弟子形容聖人盛德有所難言爾如女奚不曰下面三句元晦以謂發憤忘食者言其求道之切聖人自道理中流出即言求道之切恐非所以言聖人此三句只好渾然作一氣象看則見聖人渾是道理不見有身世之礙故不知老之將至爾元晦更以此意推廣之看如何大抵夫子一極際氣象終是難形容也尹和靖以謂皆不居其聖之意此亦甚大但不居其聖一節事乃是門人推尊其實如此故孔子不居因事而見爾若常以不居其聖橫在肚裡則非所以言聖人矣如何如何以今日事勢觀之處此時唯儉德避難更如韜晦為得所他皆不敢以姑息自恕之事奉聞也元晦更切勉之上蔡先生語近看甚有力渠一處云凡事必有根又云必須有用處尋討要用處病根將來斬斷便沒事此語可時時經心也壬午七月二十一日書云某在建安竟不樂彼蓋初與家人約二老只欲在此繼而家人為兒輩所迫不能謹守遂往某獨處家中亦自不便故不獲已往來彼此不甚快自念所寓而安方是道理今乃如此正好就此下工夫看病痛在甚處以驗之他皆不足道也某幸得早從羅先生遊自少時粗聞端緒中年一無佽助為世事淟汩者甚矣所幸比年來得吾元晦相與講學於頺墯中復此激發恐庶幾於晚境也何慰之如封事熟讀數過立意甚佳今日所以不振立志不定事功不成者正坐此以和議為名爾書中論之甚善見前此赦文中有和議處一條又有事迫許便宜從事之語蓋皆持兩端使人心疑也要之斷然不可和自整頓紀綱以大義斷之以示天下向背立為國是可爾此處更可引此又許便宜從事更下數語以曉之如何某不能文不能下筆也封事中有少疑處已用貼紙貼出矣更詳之明道語云治道在於修己責任求賢封事中此意皆有之矣甚善甚善吾儕雖在山野憂世之心但無所伸爾亦可早發去為佳辛巳八月七日書云某歸家凡百只如舊但兒輩所見凡下家中全不整頓至有疏漏欲頺敝處氣象殊不佳既歸來不免令人略略修治亦須苟完可爾家人猶豫未歸諸事終不便亦欲於冷落境界上打疊庶幾漸近道理他不敢恤但一味窘束亦有沮敗人佳處無可奈何也謝上蔡語極好玩味蓋渠皆是於日用上下工夫又言語只平説尤見氣味深長今已抄得一本矣謹以奉內恐亦好看也問熹昨妄謂仁之一字乃人之所以為人而異乎禽獸者先生不以為然熹因以先生之言思之而得其説敢復求正於左右熹竊謂天地生物本乎一源人與禽獸草木之生莫不具有此理其一體之中即無絲毫欠剩其一氣之運亦無頃刻停息所謂仁也先生批云有有血氣者有無血氣者更體究此處但氣有清濁故稟有偏正惟人得其正故能知其本具此理而存之而見其為仁物得其偏故雖具此理而不自知而無以見其為仁然則仁之為仁人與物不得不同知人之為人而存之人與物不得不異故伊川夫子既言理一分殊而龜山又有知其理一知其分殊之説而先生以為全在知字上用著力恐亦是此意也先生勾斷批云以上大概得之他日更用熟講體認不知果是如此否又詳伊川之語推測之竊謂理一而分殊此一句言理之本然如此全在性分之內本體未發時看先生抹出批云須是兼本體已發未發時看合內外為可合而言之則莫非此理然其中無一物之不該便自有許多差别雖散殊錯糅不可名狀而纎微之間同異畢顯所謂理一而分殊也知其理一所以為仁知其分殊所以為義此二句乃是於發用處該攝本體而言因此端緒而下工夫以推尋之處也蓋理一而分殊一句正如孟子所云必有事焉之處而下文兩句即其所以有事乎此之謂也先生抹出批云恐不須引孟子説以證之孟子之説若以微言恐下工夫處落空如釋氏然孟子之説亦無隱顯精微之間今録謝上蔡一説於後玩味之即無時不是此理也此説極有力大抵仁字正是天理流動之機以其包容和粹涵育融漾不可名貌故特謂之仁其中自然文理密察各有定體處便是義只此二字包括人道已盡義固不能出乎仁之外仁亦不離乎義之內也然則理一而分殊者乃是本然之仁義先生勾斷批云推測到此一段甚密為得之加以涵養何患不見道也甚慰甚慰前此乃以從此推出分殊合宜處為義失之逺矣又不知如此上則推測又還是不更乞指教先生曰謝上蔡云吾常習忘以養生明道曰施之養則可於道則有害習忘可以養生者以其不留情也學道則異於是必有事焉勿正何謂乎且出入起居寧無事者正心待之則先事而迎忘則涉乎去念助則近於留情故聖人心如鑑所以異於釋氏心也上蔡録明道此語於學者甚有力蓋尋常於靜處體認下工夫即於閙處使不著蓋不曾如此用功也自非謝先生確實於日用處便下工夫又言吾每就上作工夫學即恐明道此語亦未必引得出來此語録所以極好玩索近方看見如此意思顯然元晦於此更思看如何唯於日用處便下工夫或就事上便下工夫庶幾漸可合為己物不然只是説也某輒妄意如此如何如何問熹又問孟子養氣一章向者雖蒙曲折面誨而愚意竟未見一總會處近日求之頗見大體只是要得心氣合而已故説持其志無暴其氣必有事焉而勿正心勿忘勿助長也皆是緊切處只是要得這裏所存主處分明則一身之氣自然一時奔湊翕聚向這裡來存之不已及其充積盛滿晬面盎背便是塞乎天地氣象非求之外也如此則心氣合一不見其間心之所向全氣隨之雖加齊之卿相得行道焉亦沛然行其所無事而已何動心之有易曰直方大不習無不利而文言曰敬義立而德不孤則不疑其所行也正是此理不審先生以為如何先生曰養氣大概是要得心與氣合不然心是心氣是氣不見所謂集義處終不能合一也元晦云睟面盎背便是塞乎天地氣象與下云亦沛然行其所無事二處為得之見得此理甚好然心氣合一之象更用體察令分曉路陌方是某尋常覺得於畔援歆羡之時未必皆是正理亦心與氣合到此若倣佛有此氣象一差則所失多矣豈所謂浩然之氣耶某竊謂孟子所謂養氣者自有一端緒須從知言處養來乃不差於知言處下工夫儘用熟也謝上蔡多謂於田地上面下工夫此知言之説乃田地也先於此體認令精審認取心與氣合之時不倚不偏氣象是如何方可看易中所謂直方大不習無不利然後不疑其所行皆沛然矣元晦更於此致思看如何某率然如此極不揆是與非更俟他日面會商量可也問熹近看中庸鬼神一章竊謂此章正是發明顯微無間只是一理處且如鬼神有甚形迹然人却自然有畏敬之心以承祭祀便如真有一物在其上下左右此理亦有甚形迹然人却自然秉彛之性才存主著這裏便自見得許多道理參前倚衡雖欲頃刻離而遁之而不可得只為至誠貫徹實有是理無端無方無二無雜方其未感寂然不動及其既感無所不通濂溪翁所謂靜無而動有至正而明達者於此亦可以見之不審先生以為如何先生曰此段看得甚好更引濂溪翁所謂靜無而動有作一貫曉會尤佳中庸發明微顯之理於承祭祀時為言者若謂於此時鬼神之理昭然易見令學者有入頭處爾但更有一説若看此理須於四方八面盡皆收入體究來令有會心處方是謝上蔡云鬼神橫渠説得來别這箇便是天地間妙用須是將來做箇題目入思慮始得講説不濟事又云鬼神自家要有便有要無便無更於此數者一併體認不可滯在一隅也某偶見如此如何如何壬午八月九日書云此箇氣味為上下相咻無不如此者這箇風俗如何得變某於此有感焉當今之時苟有修飭之士須大段涵養韜晦始得若一旦齟齬有所去就雖去流俗逺矣然以全體論之得失未免相半也使衰世之公子皆信厚須如文王方得若未也恐不若且誦龜山與胡文定梅花詩直是氣味深長也如何龜山詩欲驅殘臘變春風只有寒梅作選鋒莫把疏英輕鬭雪好藏清艷月明中右渚宫觀梅寄康侯韜晦一事嘗驗之極難自非大段涵養深潛定不能如此遇事輒發矣亦不可輕看也如何如何書後注此數語十月朔日書云承諭近日看仁一字頗有見處但乍喧乍靜乍明乍暗子細點檢儘有勞攘處詳此足見潛心體認用力之效蓋須自見得病痛窒礙處然後可進因此而修治之推測自可見甚慰甚慰孟子曰夫仁亦在夫熟之而已乍明乍暗乍喧乍靜皆未熟之病也更望勉之至祝至祝癸未五月二十三日書云近日涵養必見應事脫然處否須就事兼體用下工夫久久純熟漸可見渾然氣象矣勉之勉之六月十四日書云承諭令表弟之去反而思之中心不能無愧悔之恨自非有志於求仁何以覺此語録有云罪已責躬不可無然亦不可常留在心中為悔來諭云悔吝己顯然如何便銷隕得胸中若如此即於道理極有礙有此氣象即道理進步不得矣政不可不就此理會也某竊以謂有失處罪已責躬固不可無然過此以往又將奈何常留在胸中却是積下一團私意也到此境界須推求其所以愧悔不去為何而來若來諭所謂似是於平日事親事長處不曾存得恭順謹畏之心即隨處發見之時即於此處就本源處推究涵養之令漸明即此等固滯私意當漸化矣又昔聞之羅先生云橫渠教人令且留意神化二字所存者神便能所過者化私吝盡無即渾是道理即所過自然化矣更望以此二説於靜默時及日用處下工夫看如何吾輩今日所以差池道理不進者只為多有坐此境界中爾禪學者則不然渠亦有此病却只要絶念不採以是為息滅殊非吾儒就事上各有條理也元晦試更以是思之如何或體究得不以為然便中示報為望後見先生又云前日所答只是據今日病處説語録中意却未盡他所以如此説只是提破隨人分量看得如何若地位高低人微有如此處只如此提破即渙然冰釋無復凝滯矣某人之去傳者以為緣衆士人於通衢罵辱之責以講和誤國之罪時事遂激而一變或以為逐此人誠快輿論然罵辱之者亦無行遣恐使人失上下之分某竊以為不然今日之事只為不曾於原本處理會末流雖是亦何益不共戴天正今日第一義舉此不知其他即𢎞上下之道而氣正矣遐方所以盛者只為三綱五常之道衰也七月十三日書云在此粗安第終不樂於此若以謂隨所寓而安之即於此臲卼便不是此微處皆學者之大病大凡只於微處充擴之方見礙者大爾七月二十八日書云今日三綱不振義利不分緣三綱不振故人心邪辟不堪用是致上下之氣間隔而中國之道衰逺方盛皆由此來也義利不分自王安石用事陷溺人心至今不自知覺如前日有旨有升擢差遣之類緣有此利誘故人只趨利而不顧義而主勢孤此二事皆今日之急者欲人主於此留意二者苟不爾則是雖有粟吾得而食諸也與劉平甫書云學問之道不在於多言但默坐澄心體認天理若見雖一毫私欲之發亦自退聽矣久久用力於此庶幾漸明講學始有力也又與劉平甫書云大率有疑處須靜坐體究人倫必明天理必察於日用處著力可見端緒在勉之爾延平答問
